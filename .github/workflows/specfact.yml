name: SpecFact Contract Validation

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  specfact-validation:
    name: Contract Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install project dependencies (including dev extras for tools)
        run: uv sync --extra dev

      - name: Install SpecFact CLI
        run: pip install --upgrade specfact-cli

      - name: Bootstrap SpecFact bundles
        # --no-interactive and --mode cicd are global flags (must precede subcommand)
        run: specfact --no-interactive --mode cicd --skip-checks init --profile solo-developer

      - name: Set up CrossHair Configuration
        # --no-interactive is a global flag; setup has no --no-interactive flag
        run: specfact --no-interactive --mode cicd --skip-checks code repro setup
        continue-on-error: true

      - name: Run Contract Validation
        # --budget does not exist on `code repro`; --no-interactive is a global flag
        run: specfact --no-interactive --mode cicd --skip-checks code repro --verbose

      - name: Upload enforcement report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specfact-report-${{ github.run_number }}
          path: .specfact/reports/enforcement/
          if-no-files-found: ignore
          retention-days: 7
