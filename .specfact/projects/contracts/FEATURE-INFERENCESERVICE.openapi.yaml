openapi: 3.0.3
info:
  title: Inference Service
  version: 1.0.0
  description: API contract extracted from code for Inference Service
paths:
  /summary-cache-service/save-to-cache:
    get:
      operationId: save_to_cache
      summary: Save To Cache
      description: "Persist an LLM-generated summary to the cache.\n\nUses INSERT-OR-REPLACE\
        \ semantics: an existing entry for the same\n``note_id`` is overwritten.\n\
        \nArgs:\n    session: Active SQLAlchemy session.\n    note_id: The note's\
        \ ID.\n    content_hash: Hash used to detect future content changes.\n   \
        \ summary_dict: Dict with ``summary`` (str) and ``keywords`` (list[str]).\n\
        \    llm_model: Model name used for generation (for audit/debug)."
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Not Found
      tags:
      - SummaryCacheService
  /search-service/initialize:
    get:
      operationId: initialize
      summary: Initialize
      description: Initialize the service and dependencies.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Not Found
      tags:
      - SearchService
  /search-service/search-combined:
    get:
      operationId: search_combined
      summary: Search Combined
      description: "Perform a combined search with multiple criteria.\n\nUses FTS5\
        \ full-text search if enabled and text query provided,\notherwise falls back\
        \ to legacy in-memory search.\n\nArgs:\n    text: Text query (FTS5 syntax\
        \ supported if enabled)\n    tags: Filter by tags\n    note_type: Filter by\
        \ note type\n    start_date: Filter by creation date (start)\n    end_date:\
        \ Filter by creation date (end)\n\nReturns:\n    List of SearchResult objects\
        \ sorted by relevance"
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchResult'
        '404':
          description: Not Found
      parameters:
      - name: text
        in: query
        required: false
        schema:
          type: object
        description: 'Query parameter: text'
      - name: tags
        in: query
        required: false
        schema:
          type: object
        description: 'Query parameter: tags'
      - name: note_type
        in: query
        required: false
        schema:
          type: object
        description: 'Query parameter: note_type'
      - name: start_date
        in: query
        required: false
        schema:
          type: object
        description: 'Query parameter: start_date'
      - name: end_date
        in: query
        required: false
        schema:
          type: object
        description: 'Query parameter: end_date'
      tags:
      - SearchService
  /search-service/suggest-tags:
    get:
      operationId: suggest_tags
      summary: Suggest Tags
      description: "Suggest tags for *content* using TF-IDF cosine similarity.\n\n\
        Args:\n    content: Text content to match against existing tag taxonomy.\n\
        \    limit: Maximum number of suggestions to return.\n\nReturns:\n    List\
        \ of ``{\"tag\": str, \"confidence\": float}`` dicts sorted by\n    confidence\
        \ descending. Returns an empty list if no relevant\n    matches are found."
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '404':
          description: Not Found
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: 'Query parameter: limit'
      tags:
      - SearchService
  /zettel-service/initialize:
    get:
      operationId: initialize
      summary: Initialize
      description: Initialize the service and dependencies.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Not Found
      tags:
      - ZettelService
  /zettel-service/create-note:
    post:
      operationId: create_note
      summary: Create Note
      description: Create a new note.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          description: Bad Request
        '422':
          description: Validation Error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      parameters:
      - name: note_type
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/NoteType'
        description: 'Query parameter: note_type'
      - name: tags
        in: query
        required: false
        schema:
          type: object
        description: 'Query parameter: tags'
      - name: metadata
        in: query
        required: false
        schema:
          type: object
        description: 'Query parameter: metadata'
      tags:
      - ZettelService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
  /zettel-service/update-note:
    put:
      operationId: update_note
      summary: Update Note
      description: Update an existing note.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          description: Bad Request
        '422':
          description: Validation Error
        '404':
          description: Not Found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      parameters:
      - name: title
        in: query
        required: false
        schema:
          type: object
        description: 'Query parameter: title'
      - name: content
        in: query
        required: false
        schema:
          type: object
        description: 'Query parameter: content'
      - name: note_type
        in: query
        required: false
        schema:
          type: object
        description: 'Query parameter: note_type'
      - name: tags
        in: query
        required: false
        schema:
          type: object
        description: 'Query parameter: tags'
      - name: metadata
        in: query
        required: false
        schema:
          type: object
        description: 'Query parameter: metadata'
      tags:
      - ZettelService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
  /zettel-service/delete-note:
    delete:
      operationId: delete_note
      summary: Delete Note
      description: Delete a note.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Not Found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      tags:
      - ZettelService
  /zettel-service/search-notes:
    get:
      operationId: search_notes
      summary: Search Notes
      description: Search for notes based on criteria.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
        '404':
          description: Not Found
      tags:
      - ZettelService
  /zettel-service/add-tag-to-note:
    post:
      operationId: add_tag_to_note
      summary: Add Tag To Note
      description: Add a tag to a note.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          description: Bad Request
        '422':
          description: Validation Error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      tags:
      - ZettelService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
  /zettel-service/remove-tag-from-note:
    delete:
      operationId: remove_tag_from_note
      summary: Remove Tag From Note
      description: Remove a tag from a note.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '404':
          description: Not Found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      tags:
      - ZettelService
  /zettel-service/create-link:
    post:
      operationId: create_link
      summary: Create Link
      description: Create a link between notes with proper bidirectional semantics.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad Request
        '422':
          description: Validation Error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      parameters:
      - name: link_type
        in: query
        required: false
        schema:
          type: object
        description: 'Query parameter: link_type'
      - name: description
        in: query
        required: false
        schema:
          type: object
        description: 'Query parameter: description'
      - name: bidirectional
        in: query
        required: false
        schema:
          type: boolean
        description: 'Query parameter: bidirectional'
      - name: bidirectional_type
        in: query
        required: false
        schema:
          type: object
        description: 'Query parameter: bidirectional_type'
      tags:
      - ZettelService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
  /zettel-service/remove-link:
    delete:
      operationId: remove_link
      summary: Remove Link
      description: Remove a link between notes.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Not Found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      parameters:
      - name: link_type
        in: query
        required: false
        schema:
          type: object
        description: 'Query parameter: link_type'
      - name: bidirectional
        in: query
        required: false
        schema:
          type: boolean
        description: 'Query parameter: bidirectional'
      tags:
      - ZettelService
  /zettel-service/rebuild-index:
    get:
      operationId: rebuild_index
      summary: Rebuild Index
      description: Rebuild the database index from files.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Not Found
      tags:
      - ZettelService
  /zettel-service/export-note:
    get:
      operationId: export_note
      summary: Export Note
      description: Export a note in the specified format.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: string
        '404':
          description: Not Found
      parameters:
      - name: fmt
        in: query
        required: false
        schema:
          type: string
        description: 'Query parameter: fmt'
      tags:
      - ZettelService
  /zettel-service/create-notes-batch:
    post:
      operationId: create_notes_batch
      summary: Create Notes Batch
      description: "Create multiple notes in one atomic transaction.\n\nArgs:\n  \
        \  notes: List of note dicts. Each dict may contain:\n        - title (required)\n\
        \        - content (required)\n        - note_type (optional, default \"permanent\"\
        )\n        - tags (optional, list[str])\n        - metadata (optional, dict)\n\
        \nReturns:\n    Dict with keys ``created``, ``note_ids``, ``failed``, ``errors``.\n\
        \nRaises:\n    ValueError: If any note fails validation before any writes."
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad Request
        '422':
          description: Validation Error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      tags:
      - ZettelService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
  /zettel-service/create-links-batch:
    post:
      operationId: create_links_batch
      summary: Create Links Batch
      description: "Create multiple semantic links atomically.\n\nArgs:\n    links:\
        \ List of link dicts. Each dict must contain:\n        - source_id\n     \
        \   - target_id\n        - link_type (optional, default \"reference\")\n \
        \       - description (optional)\n\nReturns:\n    Dict with keys ``created``,\
        \ ``failed``, ``errors``.\n\nRaises:\n    ValueError: If any source/target\
        \ note does not exist or link_type\n        is invalid."
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad Request
        '422':
          description: Validation Error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      tags:
      - ZettelService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
  /zettel-service/verify-note:
    get:
      operationId: verify_note
      summary: Verify Note
      description: "Verify that a note is consistent between filesystem and DB index.\n\
        \nArgs:\n    note_id: ID of the note to check.\n\nReturns:\n    Dict with\
        \ keys ``note_id``, ``file_exists``, ``db_indexed``,\n    ``link_count``,\
        \ ``tag_count``, and optionally ``hint``."
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Not Found
      tags:
      - ZettelService
  /watch-folder-service/sync-all:
    get:
      operationId: sync_all
      summary: Sync All
      description: "Re-scan all watch directories and refresh the SQLite index.\n\n\
        Drops all existing ``is_readonly=True`` entries from the DB, then\nre-ingests\
        \ every Markdown file found in the configured watch dirs.\n\nReturns:\n  \
        \  Summary dict with keys:\n    - ``scanned``: total ``.md`` files encountered\n\
        \    - ``added``: notes successfully indexed\n    - ``removed``: stale entries\
        \ removed from DB\n    - ``errors``: list of ``(path, error_message)`` tuples"
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: Not Found
      tags:
      - WatchFolderService
  /l-l-m-summary-service/generate-summary:
    get:
      operationId: generate_summary
      summary: Generate Summary
      description: "Generate an English summary and keywords for a note.\n\nArgs:\n\
        \    title: Note title.\n    content: Note content (Markdown).\n    tags:\
        \ Optional list of tag names.\n\nReturns:\n    Dict with ``summary`` (str)\
        \ and ``keywords`` (list[str]), or\n    ``None`` if generation failed or is\
        \ disabled."
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Not Found
      parameters:
      - name: tags
        in: query
        required: false
        schema:
          type: object
        description: 'Query parameter: tags'
      tags:
      - LLMSummaryService
components:
  schemas: {}
